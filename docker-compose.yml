version: "3.9"

services:
  ci3-php1:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./botol-app1:/var/www/html
    expose:
      - "9000"
    networks:
      - appnet

  ci3-php2:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./botol-app2:/var/www/html
    expose:
      - "9000"
    networks:
      - appnet

  app1:
    image: nginx:latest
    volumes:
      - ./botol-app1:/var/www/html
      - ./nginx-app1.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ci3-php1
    networks:
      - appnet

  app2:
    image: nginx:latest
    volumes:
      - ./botol-app2:/var/www/html
      - ./nginx-app2.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ci3-php2
    networks:
      - appnet

  nginx-lb:
    image: nginx:latest
    ports:
      - "8888:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - appnet

  db:
    image: mysql:5.7
    environment:
      mysql_root_password: rootpw
      mysql_database: botol
      mysql_user: appuser
      mysql_password: secretpw
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"  # <--- Tambahkan baris ini
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - appnet

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=regykurnia
    networks:
      - appnet

  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - appnet

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: monitoring-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - appnet

volumes:
  dbdata:

networks:
  appnet: