---
# 1. DATABASE (MySQL)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:5.7
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "secretpw"
        - name: MYSQL_DATABASE
          value: "botol"
        - name: MYSQL_USER
          value: "appuser"
        - name: MYSQL_PASSWORD
          value: "secretpw"
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
# 2. APLIKASI CI3 (Replika untuk Load Balancing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci3-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ci3-inventory
  template:
    metadata:
      labels:
        app: ci3-inventory
    spec:
      containers:
      - name: php-app
        image: xcutelabel/sanditel-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ci3-service
spec:
  type: NodePort
  selector:
    app: ci3-inventory
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
